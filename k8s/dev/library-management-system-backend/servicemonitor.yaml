apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-fullstack-library-management-system-backend
  namespace: union-dev
  labels:
    app.kubernetes.io/name: go-fullstack-library-management-system-backend
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-fullstack-library-management-system-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
